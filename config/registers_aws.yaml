# AWS register map (build map Section 5). Multi-byte values are big-endian.
#
# conf: STD        standard CMIS, safe
#       CODE       decoded from IIC.vi, high confidence
#       HW         read on a real AOI module (2026-10-14): address and byte order confirmed
#       UNVERIFIED decoded, but address, byte order, format or value is not confirmed.
#                  The write guard refuses these on real hardware unless
#                  --allow-unverified is given. Confirm with firmware first.
#
# fmt:  u8, u16, s16_div256, u16_scaled (value = raw * scale), ascii,
#       u16_array, u16_scaled_array (raw = value * scale), u16le / u16le_array (little-endian),
#       bytes (list of raw byte values),
#       volt_array (raw = V / full_scale * 4095), f32_array, f32le_array (little-endian)

registers:
  # --- standard CMIS ---
  R_DTEMP:        {page: 0x00, byte: 0x0E, len: 2,  fmt: s16_div256, conf: STD}
  R_DVCC:         {page: 0x00, byte: 0x10, len: 2,  fmt: u16_scaled, scale: 0.0001, conf: STD}   # 100 uV -> V
  R_Information:  {page: 0x00, byte: 0x94, len: 34, fmt: ascii, conf: STD}    # PN 148-163, rev 164-165, SN 166-181
  R_DTXP:         {page: 0x11, byte: 0x9A, len: 16, fmt: u16_array, conf: STD}   # 0.1 uW
  R_DRXP:         {page: 0x11, byte: 0xBA, len: 16, fmt: u16_array, conf: STD}   # 0.1 uW
  R_DBias:        {page: 0x11, byte: 0xAA, len: 16, fmt: u16_array, conf: STD}
  R_Los:          {page: 0x11, byte: 0x93, len: 1,  fmt: u8, conf: STD}
  W_Reset:        {page: 0x00, byte: 0x1A, len: 1,  fmt: u8, conf: STD}          # write 0x08
  # CMIS host password entry. The AOI vendor pages (80h-FFh) stay locked until the vendor
  # password (values.vendor_password, from IIC.vi) is written here; confirmed on hardware.
  W_Password:     {page: 0x00, byte: 0x7A, len: 4,  fmt: bytes, conf: HW}
  W_TXDis:        {page: 0x10, byte: 0x82, len: 1,  fmt: u8, conf: STD}          # bit per lane; 0xFF all off, 0x00 all on

  # --- raw monitors (vendor page F3) ---
  # Little-endian on the AOI module (read-to-read noise is a few counts only this way round,
  # and TXMON/MPD_OUT*1000 then matches the stored tops_setpoint).
  R_TXMON:        {page: 0xF3, byte: 0x86, len: 16, fmt: u16le_array, conf: HW}
  R_MPD_OUT:      {page: 0xF3, byte: 0xF0, len: 16, fmt: u16le_array, conf: HW}
  R_RSSI:         {page: 0xF3, byte: 0xA6, len: 16, fmt: u16le_array, conf: HW}
  R_VCCADC:       {page: 0xF3, byte: 0x84, len: 2,  fmt: u16le, conf: HW}

  # --- bias and TOPS ---
  # Per-laser bias setpoint at room temperature (lanes 1/5, 2/6, 3/7, 4/8 share a laser).
  # Address from the V12 TEC change list ("Read_Bias_Setpoint_RT_0xE9_D2"); read only here.
  R_Bias_setpoint: {page: 0xE9, byte: 0xD2, len: 8, fmt: u16_array, conf: UNVERIFIED}
  # IIC.vi V6.8 (W_Bias_setpoint / HT / LT, AWS): E9h 0xD2 / 0xB0 / 0xB8, 4 x u16, one per laser.
  W_Bias_setpoint:   {page: 0xE9, byte: 0xD2, len: 8, fmt: u16_array, conf: UNVERIFIED}
  W_Bias_setpointHT: {page: 0xE9, byte: 0xB0, len: 8, fmt: u16_array, conf: UNVERIFIED}
  W_Bias_setpointLT: {page: 0xE9, byte: 0xB8, len: 8, fmt: u16_array, conf: UNVERIFIED}
  IBias:          {page: 0xE9, byte: 0xC0, len: 8,  fmt: u16_scaled_array, scale: 100, conf: UNVERIFIED}  # 4 lasers, mA; scaling: constant 100 seen
  W_IBiasPID:     {page: 0xE9, byte: 0xD0, len: 1,  fmt: u8, conf: UNVERIFIED}   # 0 = loop off; restore 15 (or 3)
  Vtops:          {page: 0xE9, byte: 0xA0, len: 16, fmt: volt_array, full_scale: 5.0, conf: CODE}
  W_TOPPID:       {page: 0xE8, byte: 0x80, len: 1,  fmt: u8, conf: UNVERIFIED}   # TOPS loop on/off; on-value unconfirmed
  tops_setpoint:  {page: 0xE8, byte: 0x82, len: 16, fmt: u16_array, conf: HW}     # big-endian, confirmed
  tops_off:       {page: 0xE8, byte: 0xCC, len: 16, fmt: volt_array, full_scale: 5.0, conf: CODE}
  tops_room:      {page: 0xE8, byte: 0xAC, len: 16, fmt: volt_array, full_scale: 5.0, conf: CODE}

  # --- calibration storage: 4 slopes then 4 offsets per page, 4 bytes per value ---
  # UNVERIFIED: float32 and big-endian are assumptions, and so is "EC = CH1-4, ED = CH5-8".
  # Read from a calibrated AOI module (2026-10-14): float32 LITTLE-endian, the 4 OFFSETS
  # come first and then the 4 slopes (the build map had slope/offset the other way round);
  # EC holds CH1-4, ED CH5-8. Confirmed for TX and VCC: offset + slope * raw monitor
  # reproduces the module's own DDMI value exactly - confirmed for TX, RX and VCC
  # (RX on SN P172261904749 with light on the receiver, 2026-10-15).
  DTXPCal_A:      {page: 0xEC, byte: 0xC0, len: 32, fmt: f32le_array, conf: HW}           # offsets CH1-4, slopes CH1-4
  DTXPCal_B:      {page: 0xED, byte: 0xC0, len: 32, fmt: f32le_array, conf: HW}           # offsets CH5-8, slopes CH5-8
  DRXPCal_A:      {page: 0xEC, byte: 0x90, len: 32, fmt: f32le_array, conf: HW}           # offsets CH1-4, slopes CH1-4
  DRXPCal_B:      {page: 0xED, byte: 0x90, len: 32, fmt: f32le_array, conf: HW}           # offsets CH5-8, slopes CH5-8
  VccCal:         {page: 0xEB, byte: 0x90, len: 8,  fmt: f32le_array, conf: HW}           # offset, slope

  # --- mode registers: page/byte order unconfirmed (build map 5.5) ---
  AWS_Test_Mode:      {page: 0xEE, byte: 0x80, len: 1, fmt: u8, conf: UNVERIFIED}   # 1 = enter test mode
  TestMode:           {page: 0xEE, byte: 0x83, len: 1, fmt: u8, conf: UNVERIFIED}   # 0xCC to exit
  DSP_TestMode:       {page: 0xCF, byte: 0x81, len: 1, fmt: u8, conf: UNVERIFIED}   # W_Debug_AWS = 1, W_Nomal_AWS = 0
  DSP_OperatingMode:  {page: 0xCF, byte: 0x86, len: 1, fmt: u8, conf: UNVERIFIED}   # W_Daul_AWS = 5, W_Mission_AWS = 0
  TempOffFunc:        {page: 0xFE, byte: 0x95, len: 1, fmt: u8, conf: UNVERIFIED}   # IIC.vi V6.8 "Disable/Read Temp Off Func": FEh 0x95, disable = 59

# Values the flow writes that are themselves unconfirmed.
values:
  # Both from IIC.vi, confirmed on hardware 2026-10-15: 'AOIW' unlocks READING pages 80h-FFh
  # (writes are acknowledged but discarded); 83 4A 2D 4C also unlocks WRITING them.
  vendor_password: [0x41, 0x4F, 0x49, 0x57]
  vendor_write_password: [0x83, 0x4A, 0x2D, 0x4C]
  reset: 0x08
  toppid_off: 0
  toppid_on: 1
  ibiaspid_off: 0
  ibiaspid_restore: 15
  aws_test_mode_enter: 1
  aws_test_mode_ddmi: 0          # 800G_TRx_Test.vi V6.8 Set_Temp, DDMI CAL + AWS: W_AWS_Test_Mode = 0
  txdis_all_on: 0x00             # IIC.vi W_TXDis "Channel 8"
  txdis_all_off: 0xFF            # IIC.vi W_TXDis "Channel 9"
  test_mode_exit: 0xCC
  dsp_debug: 1
  dsp_normal: 0
  dsp_dual: 5
  dsp_mission: 0
  temp_off_func_disable: 59      # 800G_TRx_Test.vi V6.8 ShowPF (AWS, DDMI CAL)
