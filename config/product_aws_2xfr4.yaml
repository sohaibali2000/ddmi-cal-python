# Product settings for AWS 800G 2xFR4 at DDMI Cal (LabVIEW V6.8).
# Items marked VERIFY are decoded but unconfirmed; do not hard-code them.
customer: AWS
channels: 8
lasers: 4                          # lane n and n+4 share laser n

flow:
  # VERIFY: order of the DDMI_Cal.vi frames (frame numbers are temp 0, vcc 1, tx 2, rx 3).
  ddmi_cal_order: [tx, rx, vcc, temp]

mpd_scan:
  vtops_start: 0.5                 # V (Acacia 0.0-2.0/0.01; others 0.0-1.5/0.02)
  vtops_stop: 3.0
  vtops_step: 0.02
  # The fraction array as it appears in the LabVIEW code. Read as 1 - x of the peak it
  # gives the operating points at 35 / 44 / 50 / 56 % of peak (4.5 / 3.5 / 3.0 / 2.5 dB
  # below it). VERIFY against Peak Search.vi; the other modes are x_of_peak, x_of_span,
  # one_minus_x_of_span.
  op_point_fractions: [0.65, 0.56, 0.50, 0.44]
  op_point_mode: one_minus_x_of_peak
  # Tops_Mid = mean of the voltages at the 3.5 dB (44 %) and 3.0 dB (50 %) points,
  # about 3.25 dB below the peak.
  tops_mid_from: [0.56, 0.50]
  setpoint_scale: 1000             # tops_setpoint = round(TXMON / MPD_OUT * 1000)
  scan_attempts: 1                 # V12: 2 attempts, up to 2 scans each

tx_disable:
  step_v: 0.01
  max_steps: 4
  settle_s: 0.2                    # VERIFY: wait after each tops_off step (not in the build map)
  extra_steps_if_above_dbm: null   # V12: -18 dBm -> 5 more steps
  limit_dbm: [-60, -16]

tx_power_meter:
  # 8-channel MPO meter: wavelength per channel (the meter supports 1270/1290/1310/1330)
  # and averaging time, as the production Tx Loss tool sets them.
  wavelengths_nm: [1270, 1290, 1310, 1330, 1270, 1290, 1310, 1330]
  avg_time_ms: 100

tx_loss:
  # Before measuring, wait for the golden sample's DDMI temperature to settle, as the
  # production Tx Loss tool does: a reading every 15 s, stable after 3 readings in a row
  # that each changed by less than 0.1 degC.
  stabilize: true
  interval_s: 15
  threshold_c: 0.1
  consecutive: 3
  timeout_s: 1800

showpf:
  # restore: write back the mode registers as read before the run (safe for a module that
  # was already in its shipping state). labview: the V6.8 sequence with unconfirmed values.
  mode_cleanup: restore

tx_cal:
  bias_ma: [60, 180]               # other 2xFR4: [70, 130]
  settle_s: 2.0
  after_reset_wait_s: 10.0

rx_cal:
  points_dbm: [-2, -10]
  check_dbm: -6
  # Attenuator wavelength per lane (the AT4308 is calibrated at 1270/1290/1310/1330).
  wavelengths_nm: [1270, 1290, 1310, 1330, 1270, 1290, 1310, 1330]
  settle_s: 1.0                    # VERIFY (computed delay in code)

vcc:
  nominal_v: 3.3
  cal_points_v: [3.13, 3.47]
  settle_s: 2.0
  adjust_tolerance_v: 0.01

limits:                            # placeholders - replaced by the MES spec
  tx_disable_dbm: [-60, -16]
  dtxp_db: [-0.5, 0.5]
  rx_check_error_db: [-0.5, 0.5]
  rx_slope: [5, 30]                # applied to Rxp_Slope. VERIFY against real data: depends on the RSSI units
  dvcc_v: [-0.033, 0.033]
  ddmi_temp_c: [30, 60]
  tx_loss_warn_db: 3.5
