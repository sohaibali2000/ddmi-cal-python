# Product settings for AWS 800G 2xFR4 at DDMI Cal (LabVIEW V6.8).
# Items marked VERIFY are decoded but unconfirmed; do not hard-code them.
customer: AWS
channels: 8
lasers: 4                          # lane n and n+4 share laser n

flow:
  scan_mpd_passes: 2                # V6.8 Scan_MPD state: scan + adjust power + scan disable, up to 2 passes
  # 800G_TRx_Test.vi V6.8 DDMI_CAL: DDMI_Adjust_TX, DDMI_RXP, DDMI_VCC, DDMI_Temp.
  ddmi_cal_order: [tx, rx, vcc, temp]

mpd_scan:
  vtops_start: 0.5                 # V (Acacia 0.0-2.0/0.01; others 0.0-1.5/0.02)
  vtops_stop: 3.0
  vtops_step: 0.02
  # TXMON on the real module refreshes only every ~200 ms and the heater needs time to
  # settle: read it straight after a Vtops write and the curve comes out as stale steps.
  start_settle_s: 1.0              # at the first voltage, before the sweep
  step_settle_s: 0.3               # after every Vtops step. V6.8 waits 50 ms + its slow I2C; this
                                   # station's TXMON refreshes every ~200 ms (50 ms gave stepped curves)
  op_point_settle_s: 1.0           # after moving to each operating point, before TXMON/MPD_OUT are read
  # MPD Monitor.vi V6.8 constants
  start_vtops: 1.0                 # first frame: every lane to 1.0 V (loops off, tops_off 0)
  pre_scan_wait_s: 1.0
  write_clamp_v: [0.2, 3.0]        # Vtops / tops_off coerced before the final write
  end_wait_s: 2.0                  # before W_Reset
  after_reset_wait_s: 10.0
  # MPD Monitor.vi V6.8 constant [0.65, 0.56, 0.50, 0.44], used as (1 - x) x peak: the
  # operating points at 35 / 44 / 50 / 56 % of peak (4.5 / 3.5 / 3.0 / 2.5 dB below it),
  # each taken at the closest sweep step on the first rising edge. The resulting
  # TXMON/MPD_OUT ratios rise toward the peak, as in the production CSV.
  op_point_fractions: [0.65, 0.56, 0.50, 0.44]
  op_point_mode: one_minus_x_of_peak
  # Tops_Mid = mean of the voltages at the 3.5 dB (44 %) and 3.0 dB (50 %) points,
  # about 3.25 dB below the peak.
  tops_mid_from: [0.56, 0.50]
  setpoint_scale: 1000             # tops_setpoint = round(TXMON / MPD_OUT * 1000)
  scan_attempts: 2                 # V6.8 Scan_MPD: the MPD Monitor call repeats once if the scan fails

tops_lock:
  # After the loop is switched on and after every reset: loop off, Vtops = Tops_Mid, loop on,
  # then each lane's TXMON/MPD_OUT*1000 must be within ratio_tolerance of its tops_setpoint.
  settle_s: 1.5
  ratio_tolerance: 0.3
  min_mpd_out: 100                 # an unlocked lane at the fringe top read MPD_OUT 27
  attempts: 2

adjust_power:
  # Item_Test.vi V6.8 "Adjust Power", AWS LC-2*FR4 (one step, per laser = lanes n and n+4)
  default_setpoint: [280, 280, 410, 450]
  window_dbm: [0.7, 2.3]           # mean of the lane pair, true power
  step_up: 20                      # below the window
  step_down: 30                    # above the window
  settle_s: 2.0
  min_light_dbm: -10               # any lane darker: no light from the module -> stop, bias untouched

tx_disable:
  # Item_Test.vi V6.8 "Scan_Disable": all lanes disabled together, step 0.01 V, one step
  # each side, then 4 toward darker; lanes still above -18 dBm get 5 more.
  step_v: 0.01
  steps: 4
  recheck_dbm: -18
  extra_steps: 5
  enable_wait_s: 1.0
  # V6.8 waits only 0-0.1 s per step, but its I2C is far slower than this station's. Our
  # module needs seconds to settle after a disable, so each step is read once steady.
  poll_s: 0.5
  min_s: 1.0
  max_s: 8.0
  stable_readings: 3
  tol_db: 0.5
  dark_enough_dbm: -22             # a lane this dark counts as settled
  limit_dbm: [-60, -16]

tx_power_meter:
  # 8-channel MPO meter: wavelength per channel (the meter supports 1270/1290/1310/1330)
  # and averaging time, as the production Tx Loss tool sets them.
  wavelengths_nm: [1270, 1290, 1310, 1330, 1270, 1290, 1310, 1330]
  avg_time_ms: 100

tx_loss:
  # Before measuring, wait for the golden sample's DDMI temperature to settle, as the
  # production Tx Loss tool does: a reading every 15 s, stable after 3 readings in a row
  # that each changed by less than 0.1 degC.
  stabilize: true
  interval_s: 15
  threshold_c: 0.1
  consecutive: 3
  timeout_s: 1800

showpf:
  # labview: 800G_TRx_Test.vi V6.8 ShowPF for AWS DDMI CAL - Temp Off Func 59 (FEh 0x95),
  # TestMode 0xCC, W_Reset, 10 s, DSP modes read back 0 (values read from the V6.8 VIs).
  # restore: write back the mode registers exactly as read before the run.
  mode_cleanup: labview

tx_cal:
  bias_ma: [60, 180]               # other 2xFR4: [70, 130]
  settle_s: 2.0
  after_reset_wait_s: 10.0

rx_cal:
  points_dbm: [-2, -10]
  check_dbm: -6
  # Attenuator wavelength per lane (the AT4308 is calibrated at 1270/1290/1310/1330).
  wavelengths_nm: [1270, 1290, 1310, 1330, 1270, 1290, 1310, 1330]
  # Wait after setting a lane pair = att_delay_s + 2 s (DDMI_Cal.vi / Item_Test.vi V6.8). att_delay_s
  # is the station setting "ATT Delay(s)" (front-panel field "BERT Time", system_Data.ini); its
  # production value is not in the V6.8 copy - 0 gives V6.8's minimum of 2 s.
  att_delay_s: 0.0

wait_temp:
  # V6.8 skips Wait_Temp at the DDMI Cal station (no temperature controller; the Wait_Temp
  # frame compares the station with "DDMI Cal"). DDMI_Temp 30-60 C is still checked at the end.
  enabled: false
  # V6.8 Wait_Temp (RT, AWS) waits for the CASE temperature (thermostream sensor) to be 30-40 C.
  # This station has no case sensor; the module's DDMI temperature reads a few degrees above
  # the case, so the wait uses the DDMI_Temp spec instead: a cold module is warmed up first.
  range_c: [30, 60]
  poll_s: 2.0
  timeout_s: 600

vcc:
  icc_min_ma: 1800                 # V6.8 "ICC Spec.txt" (1.8 A)
  adjust_wait_s: 2.0               # Auto Adjust Vcc.vi V6.8: 2000 ms after every supply change
  current_limit_ma: 6000           # V6.8 VCC state: "Limit Curr (mA)" passed to Auto Adjust Vcc.vi
  nominal_v: 3.3
  cal_points_v: [3.13, 3.47]
  settle_s: 2.0
  adjust_tolerance_v: 0.01         # Auto Adjust Vcc.vi: done when |target - module| < 0.01 V

limits:                            # replaced by the MES spec when online
  # From the MAX/MIN rows of the production station's CSV (2026-10 DDMI2XFR4 files).
  tops_setpoint: [100, 2500]
  bias_setpoint: [100, 2500]
  tops_mid_v: [0, 3]
  tops_off_v: [0, 3]
  txp_dbm: [-3.3, 10000]
  ddmi_txp_dbm: [-3.8, 10000]
  txp_offset: [-10000, 10000]
  txp_slope: [5, 150]
  rxp_offset: [-10000, 10000]
  real_vcc_v: [3.234, 3.366]
  vcc_offset: [-10000, 10000]
  vcc_slope: [15, 30]
  tx_disable_dbm: [-60, -16]
  dtxp_db: [-0.5, 0.5]
  rx_check_error_db: [-0.5, 0.5]
  rx_slope: [5, 30]                # Rxp_Slope; same as the production CSV MAX/MIN (our slopes ~18-21)
  dvcc_v: [-0.033, 0.033]
  ddmi_temp_c: [30, 60]
  tx_loss_warn_db: 3.5
